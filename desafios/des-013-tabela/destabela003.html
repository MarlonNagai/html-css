<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 03</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-size: 3em;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px 15px;
        }

        th {
            background-color: gray;
            color: white;
            font-size: 1.2em;
        }

        td{
            text-align: center;
        }

        .rowgroup {
            color: black;
            background-color: white;
        }

        .medias {
            background-color: gray;
            color: white;
        }

        .materia {
            text-align: left;
        }
        #medias {
            text-align: left;
        }


    </style>
</head>
<body>
    <h1>Desafio da tabela 03</h1>
    <table>
        <caption>
            <tr>
                <th rowspan="2n" scope="col">Área</th>
                <th rowspan="2n" scope="col">Disciplinas</th>
                <th colspan="2n" scope="col">Notas</th>
                <th rowspan="2n" scope="col">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </caption>
        <tbody>
            <tr>
                <th class="rowgroup" scope="rowgroup" rowspan="4n">Exatas</th>
                <td class="materia">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
                <tr>
                    <th colspan="4n" scope="row" id="medias">Medias de Exatas</th>
                    <td class="medias">0.0</td>
                </tr>
            <tr>
                <th class="rowgroup" scope="rowgroup" rowspan="2n" >Humanas</th>
                <td class="materia">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="materia">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4n" scope="row" id="medias">Média de Humanas</th>
                <td class="medias">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
