<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Texte de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p>
            <label for="iusu">usuário:</label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15"  size="10" placeholder="Usuário" autocomplete="username">
        </p>
        <p>
            <label for="ipas">Senha:</label>
            <input type="password" name="pas" id="ipas" required minlength="8" size="8" placeholder="Senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html
