<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container {
            border: 3px solid darkblue;
            display: grid;
             /* grid-template: repeat(3, 80px) / repeat(3, 120px); */
            grid-template-rows: repeat(3, 80px);
            grid-template-columns: 100px 40% repeat(2, 1fr); 
            grid-auto-rows:80px;
            grid-auto-columns: 120px;
            grid-auto-flow: row;
            gap: 10px;
            
            /*  justify-items: center;
                align-items: start;      */
            place-items:  normal normal;

            /*  align-content: space-between;
                justify-content: end;   */
            place-content: normal normal;


            /* align = pra cima ou baixo */
            /* justify = pra direita ou esquerda */
        }

        div.item {
            background-color: darkred;
            border: 3px solid darkred;
            padding: 10px;
            border-radius: 4px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
