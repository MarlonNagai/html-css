<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da pasta 02</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif
        }

        h1 {
            font-size: 3em;
        }

        table {
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            width: 100px;
            height: 30px;
            text-align: center;

        }
    </style>
</head>
<body>
    <h1>Desafio da pasta 02</h1>
    <table>
        <tr>
            <td colspan="4n">A</td>
            <td rowspan="4n">B</td>

        </tr>
        <tr>
            <td rowspan="4n">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>K</td>
            <td>L</td>
        </tr>
        <tr>
            <td colspan="4n">M</td>
        </tr>
    </table>
</body>
</html>
